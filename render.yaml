services:
  - type: web
    name: echo-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNAPSE_CHAIN
        value: calibration
      - key: RPC_URL
        value: https://api.calibration.node.glif.io/rpc/v1
      - key: CONTRACT_ADDRESS
        value: 0x5b66Cc6014787eA73fB41D5313C1FdA51c1E4401
      - key: PRIVATE_KEY
        sync: false
      - key: SYNAPSE_PRIVATE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPERATOR_API_KEY
        generateValue: true
      - key: APP_URL
        value: https://mayorken.github.io/Echo/
      - key: CORS_ORIGINS
        value: https://mayorken.github.io
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STORAGE_TREASURY_READY
        value: "false"
      - key: ENABLE_WALLET_BOOTSTRAP
        value: "true"
      - key: ONBOARDING_GAS_FIL
        value: "0.02"
